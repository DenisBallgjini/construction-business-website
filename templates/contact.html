<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contact Us</title>

<link rel="stylesheet" href="/static/css/style.css">

<style>

body {
    background-color: #111;
    font-family: 'Poppins', sans-serif;
    margin: 0;
    color: white;
}

.contact-section {

    padding: 140px 40px 80px;

    max-width: 1200px;

    margin: auto;
}

.contact-title {

    text-align: center;

    margin-bottom: 60px;
}

.contact-title h1 {

    font-size: 48px;

    margin-bottom: 15px;
}

.contact-title p {

    color: #bbb;

    font-size: 18px;
}

.contact-container {

    display: flex;

    gap: 50px;

    align-items: center;

    flex-wrap: wrap;
}

.contact-image {

    flex: 1;
}

.contact-image img {

    width: 100%;

    border-radius: 15px;

    height: 650px;

    object-fit: cover;

    box-shadow: 0px 8px 25px rgba(0,0,0,0.4);
}

.contact-form {

    flex: 1;

    background-color: #1a1a1a;

    padding: 40px;

    border-radius: 15px;

    box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
}

.contact-form label {

    display: block;

    margin-bottom: 8px;

    margin-top: 20px;

    color: #ddd;
}

.contact-form input,
.contact-form textarea {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background-color: #2a2a2a;

    color: white;

    font-size: 16px;
}

.contact-form textarea {

    min-height: 180px;

    resize: vertical;
}

.contact-form button {

    margin-top: 25px;

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 8px;

    background-color: #d6b36a;

    color: black;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    transition: 0.3s ease;
}

.contact-form button:hover {

    background-color: #e5c98f;
}

.map-section {

    margin-top: 80px;

    border-radius: 15px;

    overflow: hidden;

    box-shadow: 0px 8px 25px rgba(0,0,0,0.3);
}

iframe {

    width: 100%;

    height: 350px;

    border: none;
}

@media only screen and (max-width: 768px) {

    .contact-title h1 {
        font-size: 36px;
    }

    .contact-container {
        flex-direction: column;
    }

    .contact-image img {
        height: 400px;
    }
}

</style>

</head>

<body>

<div class="navbar">

    <a href="/">Home</a>

    <a href="/about">About</a>

    <a href="/portfolio">Portfolio</a>

    <a href="/contact">Contact</a>

</div>

<section class="contact-section">

    <div class="contact-title">

        <h1>Contact Us</h1>

        <p>
            Get in touch with us to discuss your next construction or renovation project.
        </p>

    </div>

    <div class="contact-container">

        <div class="contact-image">

            <img src="/static/images/img/about2.jpeg">

        </div>

        <div class="contact-form">

            <form method="POST">

                <label for="fname">First Name</label>

                <input
                    type="text"
                    id="fname"
                    name="firstname"
                    placeholder="Your first name"
                >

                <label for="lname">Last Name</label>

                <input
                    type="text"
                    id="lname"
                    name="lastname"
                    placeholder="Your last name"
                >

                <label for="country">Country</label>

                <input
                    type="text"
                    id="country"
                    name="countryname"
                    placeholder="Your country"
                >

                <label for="subject">Message</label>

                <textarea
                    id="subject"
                    name="subject"
                    placeholder="Write your message here..."
                ></textarea>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </div>

    </div>

    <div class="map-section">

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2479.5872783999716!2d-0.23645698446242042!3d51.57579921352107!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x487610e037c84af5%3A0xc77ad54bf141d38c!2s53%20Dallas%20Rd%2C%20London%20NW4%203JB%2C%20UK!5e0!3m2!1sen!2s!4v1609110310459!5m2!1sen!2s"
            allowfullscreen=""
            loading="lazy">
        </iframe>

    </div>

</section>

</body>

</html>

<style>

body {
    background-color: #111;
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
}

h1 {
    color: white;
    padding-top: 120px;
    padding-bottom: 30px;
    text-align: center;
    font-size: 48px;
    letter-spacing: 1px;
}

* {
    box-sizing: border-box;
}

.mySlides {
    display: none;
}

.slideshow-container {

    max-width: 1100px;

    position: relative;

    margin: auto;

    border-radius: 15px;

    overflow: hidden;

    box-shadow: 0px 8px 25px rgba(0,0,0,0.3);

    margin-top: 40px;
}

.mySlides img {

    width: 100%;

    height: 700px;

    object-fit: cover;

    display: block;
}

/* Next & previous buttons */

.prev,
.next {

    cursor: pointer;

    position: absolute;

    top: 50%;

    width: auto;

    padding: 18px;

    margin-top: -22px;

    color: white;

    font-weight: bold;

    font-size: 24px;

    transition: 0.3s ease;

    border-radius: 0 3px 3px 0;

    user-select: none;

    background-color: rgba(0,0,0,0.4);
}

.next {
    right: 0;
    border-radius: 3px 0 0 3px;
}

.prev:hover,
.next:hover {

    background-color: rgba(0,0,0,0.8);
}

/* Number text */

.numbertext {

    color: white;

    font-size: 14px;

    padding: 12px 16px;

    position: absolute;

    top: 0;

    background-color: rgba(0,0,0,0.5);

    border-bottom-right-radius: 10px;
}

/* Dots */

.dots-container {

    text-align: center;

    padding: 30px 0 60px;
}

.dot {

    cursor: pointer;

    height: 14px;

    width: 14px;

    margin: 0 4px;

    background-color: #555;

    border-radius: 50%;

    display: inline-block;

    transition: background-color 0.3s ease;
}

.active,
.dot:hover {

    background-color: #d6b36a;
}

/* Fade animation */

.fade {

    animation-name: fade;

    animation-duration: 1s;
}

@keyframes fade {

    from {
        opacity: .4
    }

    to {
        opacity: 1
    }
}

/* Mobile */

@media only screen and (max-width: 768px) {

    h1 {
        font-size: 34px;
        padding-top: 100px;
    }

    .mySlides img {
        height: 400px;
    }

    .prev,
    .next {
        font-size: 18px;
        padding: 12px;
    }
}

</style>

</head>

<script>

var slideIndex = 1;

showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {

  var i;

  var slides = document.getElementsByClassName("mySlides");

  var dots = document.getElementsByClassName("dot");

  if (n > slides.length) {
    slideIndex = 1
  }

  if (n < 1) {
    slideIndex = slides.length
  }

  for (i = 0; i < slides.length; i++) {
      slides[i].style.display = "none";
  }

  for (i = 0; i < dots.length; i++) {
      dots[i].className =
      dots[i].className.replace(" active", "");
  }

  slides[slideIndex-1].style.display = "block";

  dots[slideIndex-1].className += " active";
}

</script>
